# 本包提供的两行：接入层（装载决策模型注册表 `ctx.systemOne`，并把配置里的条目注册进去）与决策通道
# （工具、技能、两档引导、开关与可选阈值）。两行各有 id，后续层可按 id 覆盖或禁用；name 用包名，交
# Node 解析到安装副本。id 同时是各自设置页的配置命名空间，改名要连客户端半里写死的常量一起改。
# 条目的六个字段、三个 kind 与凭据引用名的写法见 README.zh.md；通道那一行的字段见子包的 README。
- insert:
    - id: dsh-system-one
      name: '@dsh-clipclop/dsh-system-one'
      # 配置示例，去掉行首的 `# ` 即可用。
      # config:
      #   entries:
      #     - id: sglang_local
      #       label: 本地 SGLang
      #       kind: systemone
      #       baseUrl: http://127.0.0.1:30000
      #       model: qwen3-4b
      #       apiKeyEnv: SGLANG_LOCAL_KEY

    # 决策通道：接在上面那一行上，`target` 指上面某个条目的 id。
    # 单独禁用这一行只少工具、引导与技能，接入层照常可用；反过来禁用接入层那一行，这一行不激活。
    - id: dsh-system-one-channel
      name: '@dsh-clipclop/dsh-system-one-channel'
      # 配置示例，去掉行首的 `# ` 即可用。
      # config:
      #   enabled: true
      #   target: sglang_local
      #   guidance: tool
      #   threshold:
      #     enabled: false
      #     value: 0.5
