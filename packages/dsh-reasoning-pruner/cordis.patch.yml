# dsh-reasoning-pruner 的 profile bundle patch 示例。顶层是数组，每个元素是一个 patch 条目；
# 新增插件用 insert 行并显式给出 id 与 name。请将本文件内容合并到你的 profile patch 中。
- insert:
    - id: dsh-reasoning-pruner
      name: '@dsh-clipclop/dsh-reasoning-pruner'
      config:
        # 两个参数都取保守默认（偏大＝少干活、少伤质量），实测后收紧。
        everySteps: 50
        keepRecentSteps: 10
